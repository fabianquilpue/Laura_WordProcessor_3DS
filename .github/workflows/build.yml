
name: Compilar Laura para Nintendo 3DS

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Compilacion Nintendo 3DS

    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Identificar version del codigo
        run: |
          echo "======================================"
          echo "COMMIT COMPILADO"
          echo "======================================"

          echo "Commit: $GITHUB_SHA"
          echo "Rama: $GITHUB_REF_NAME"
          echo "Run: $GITHUB_RUN_NUMBER"

          git log -1 --oneline

          echo "======================================"
          echo "HUELLAS DEL CODIGO FUENTE"
          echo "======================================"

          sha256sum \
            source/main.cpp \
            source/editor.cpp \
            include/editor.hpp \
            Makefile

      - name: Comprobar entorno devkitPro
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          test -f "$DEVKITARM/3ds_rules"
          test -x "$DEVKITARM/bin/arm-none-eabi-g++"
          test -f "$DEVKITPRO/libctru/include/3ds.h"

          "$DEVKITARM/bin/arm-none-eabi-g++" --version
          make --version

      - name: Comprobar estructura
        run: |
          test -f Makefile
          test -f source/main.cpp
          test -f source/editor.cpp
          test -f include/editor.hpp
          test -f assets/icon.png
          test -f assets/splash.png
          test -d romfs

      - name: Diagnosticar hidKeysDown
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          printf '#include <3ds.h>\n' | \
            arm-none-eabi-g++ \
              -x c++ \
              -std=gnu++17 \
              -D__3DS__ \
              -I"$DEVKITPRO/libctru/include" \
              -dM -E - | grep -n 'hidKeysDown' || true

          arm-none-eabi-g++ \
            -std=gnu++17 \
            -D__3DS__ \
            -I"$DEVKITPRO/libctru/include" \
            -Iinclude \
            -E source/main.cpp \
            -o /tmp/laura_preprocessed.cpp

          grep -n -C 3 'hidKeysDown' \
            /tmp/laura_preprocessed.cpp || true

      - name: Compilar Laura
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          make clean
          make V=1 -j1

      - name: Comprobar archivos compilados
        run: |
          test -f Laura.3dsx
          test -f Laura.smdh
          test -f Laura.elf

          echo "Archivos generados correctamente."

      - name: Generar identificacion de compilacion
        run: |
          {
            echo "LAURA - IDENTIFICACION DE COMPILACION"
            echo "Commit: $GITHUB_SHA"
            echo "Rama: $GITHUB_REF_NAME"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Fecha UTC: $(date -u)"
            echo ""
            echo "HUELLAS DEL CODIGO FUENTE"
            sha256sum \
              source/main.cpp \
              source/editor.cpp \
              include/editor.hpp \
              Makefile
            echo ""
            echo "HUELLAS DE LOS EJECUTABLES"
            sha256sum \
              Laura.3dsx \
              Laura.smdh \
              Laura.elf
          } > LAURA_BUILD_INFO.txt

          cat LAURA_BUILD_INFO.txt

      - name: Publicar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: Laura-Nintendo-3DS-${{ github.run_number }}-${{ github.sha }}
          path: |
            Laura.3dsx
            Laura.smdh
            Laura.elf
            LAURA_BUILD_INFO.txt
          if-no-files-found: error
