
name: Compilar Laura para Nintendo 3DS

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Compilacion Nintendo 3DS

    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar entorno devkitPro
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "Comprobando compilador..."
          test -x "$DEVKITARM/bin/arm-none-eabi-g++"
          "$DEVKITARM/bin/arm-none-eabi-g++" --version

          echo "Comprobando reglas..."
          test -f "$DEVKITARM/3ds_rules"

          echo "Comprobando libctru..."
          test -f "$DEVKITPRO/libctru/include/3ds.h"

          echo "Cabecera encontrada:"
          ls -l "$DEVKITPRO/libctru/include/3ds.h"

          echo "Entorno devkitPro correcto."

      - name: Comprobar estructura del proyecto
        run: |
          test -f Makefile
          test -f source/main.cpp
          test -f assets/icon.png
          test -f assets/splash.png
          test -d romfs

          echo "Estructura del proyecto correcta."

      - name: Diagnosticar rutas de compilacion
        run: |
          echo "Ruta de libctru:"
          ls -ld "$DEVKITPRO/libctru"
          ls -ld "$DEVKITPRO/libctru/include"

          echo "Comprobando cabecera:"
          test -f "$DEVKITPRO/libctru/include/3ds.h"

      - name: Compilar Laura
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make -j2

      - name: Comprobar archivos compilados
        run: |
          test -f Laura.3dsx
          test -f Laura.smdh
          test -f Laura.elf

          echo "Los tres archivos fueron generados correctamente."

      - name: Publicar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: Laura-Nintendo-3DS
          path: |
            Laura.3dsx
            Laura.smdh
            Laura.elf
          if-no-files-found: error
